[project]
name = "202607-credit-risk-personal"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12, <3.14"
dependencies = [
    "cudf-polars-cu13>=26.8.1",
    "fastapi>=0.140.0",
    "kaggle>=2.2.4",
    "kaleido>=1.4.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.1",
    "nvidia-cuda-nvrtc>=13.4.59",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "polars==1.42.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "ray[default]>=2.58.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "streamlit>=1.59.1",
    "tqdm>=4.69.1",
    "uvicorn>=0.51.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "fastexcel>=0.21.0",
    "great-tables>=0.23.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.2",
    "notebook>=7.6.1",
    "tqdm>=4.69.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]